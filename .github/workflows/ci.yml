name: 工程自动检查

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware-mkr-wifi-1010:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: arduino/setup-arduino-cli@v2
      - name: Install board core and sensor libraries
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:samd
                    arduino-cli lib install WiFiNINA ArduinoMqttClient ArduinoBearSSL ArduinoECCX08 Arduino_MKRENV DFRobot_HX711_I2C@1.0.0
          # Fix the malformed trailing comment in the HX711 v1.0.0 address macro.
          hx711_header="$HOME/Arduino/libraries/DFRobot_HX711_I2C/DFRobot_HX711_I2C.h"
          sed -i -E 's/^(#define[[:space:]]+HX711_I2C_ADDR[[:space:]]+\(0x64\)).*$/\1/' "$hx711_header"
      - name: Compile both sketches and report Flash and SRAM
        run: |
          for sketch in firmware/shelf1_env_engagement firmware/shelf2_inventory_assistance; do
            cp "$sketch/secrets.example.h" "$sketch/secrets.h"
            arduino-cli compile --fqbn arduino:samd:mkrwifi1010 --build-property "compiler.cpp.extra_flags=-std=gnu++17 -I${GITHUB_WORKSPACE}/${sketch}" "$sketch"
          done

  firmware-core:
    name: C++17 固件核心测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 配置 CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: 编译固件核心
        run: cmake --build build --config Release
      - name: 运行状态机与离线队列测试
        run: ctest --test-dir build --build-config Release --output-on-failure

  iot-test-harness:
    name: Python AIoT 自动化测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iot-test-harness
    steps:
      - uses: actions/checkout@v7
      - name: 安装 Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: iot-test-harness/pyproject.toml
      - name: 安装测试依赖
        run: python -m pip install -e ".[test]"
      - name: 运行契约、异常和端到端测试
        run: python -m pytest --cov=smart_shelf_testing --cov-report=term-missing --cov-fail-under=90
      - name: 运行50000条消息稳定性场景
        run: python tools/run_stability.py --messages 50000

  cloud-service:
    name: Java 云服务测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud-service
    steps:
      - uses: actions/checkout@v7
      - name: 安装 Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: cloud-service/pom.xml
      - name: 运行测试并构建
        run: mvn --batch-mode verify

  spring-alert-service:
    name: Spring 告警服务测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spring-alert-service
    steps:
      - uses: actions/checkout@v7
      - name: 安装 Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: spring-alert-service/pom.xml
      - name: 运行测试
        run: mvn --batch-mode test
