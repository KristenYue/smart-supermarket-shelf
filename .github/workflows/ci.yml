name: 工程自动检查

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloud-service:
    name: Java 云服务测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud-service
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: cloud-service/pom.xml
      - name: 运行测试并构建
        run: mvn --batch-mode verify
